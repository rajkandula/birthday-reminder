# Optional: triggers Wishly's birthday dispatcher every 15 minutes (free on GitHub Actions).
# It does nothing until you configure it. Setup: repo Settings → Secrets and variables → Actions
#   CRON_URL    = the cron edge function's address printed by `npm run deploy:cron`
#                 (or your app's https://<your app>/api/cron/dispatch). A secret or a variable.
#   CRON_SECRET = the same CRON_SECRET your app uses. A secret.
# GitHub pauses scheduled workflows after 60 days without repository activity, and does not
# run them in forks until you enable Actions there.
name: Wishly birthday dispatcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send due birthday emails
        env:
          CRON_URL: ${{ vars.CRON_URL || secrets.CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::CRON_URL or CRON_SECRET is not set; skipping. See the comments in this workflow."
            exit 0
          fi
          # The key goes in the query string, which both the edge function and /api/cron/dispatch accept.
          curl --fail-with-body --silent --show-error --max-time 90 --retry 2 \
            --get --data-urlencode "key=$CRON_SECRET" "$CRON_URL"
